name: FF Resonance Android diagnosis

on:
  push:
    branches: [codex/ff-resonance-boss-transition]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to build (baseline or candidate)
        required: true
        type: string
        default: c3aa70f81e15ea97ee85b6a9a71cbf75d370851e

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build autoconf automake libtool pkg-config nasm glslang-tools
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-37"
      - name: Record source and select the C++23 Android toolchain
        run: |
          git rev-parse HEAD | tee source-commit.txt
          git submodule status > source-submodules.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/android/app/build.gradle.kts")
          text = path.read_text()
          old = 'ndkVersion = "26.1.10909125"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'ndkVersion = "29.0.14206865"'))
          PY
      - name: Build arm64 test APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMainlineRelease --no-daemon --console=plain --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ff-resonance-android-${{ github.run_id }}
          path: |
            source-commit.txt
            source-submodules.txt
            src/android/app/build/outputs/apk/mainline/release/*.apk
            src/android/app/build/reports/
          if-no-files-found: error
